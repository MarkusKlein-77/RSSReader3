name: Build platform artifacts

on:
  push:
    branches: [main, master]
    tags: ["v*", "V*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configure Android release signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/android-release-key.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            if [ ! -s "$KEYSTORE_PATH" ]; then
              echo "::error::Decoded Android keystore is empty."
              exit 1
            fi
            {
              echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Android release signing secrets are required for tagged releases."
            exit 1
          fi

      - name: Build Android debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --no-daemon --console=plain :androidApp:assembleDebug

      - name: Build Android release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew --no-daemon --console=plain :androidApp:assembleRelease

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_SIGNING_CERT_SHA256" ]; then
            echo "::error::Set the ANDROID_SIGNING_CERT_SHA256 Actions variable to the release certificate fingerprint."
            exit 1
          fi
          mapfile -t APK_FILES < <(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#APK_FILES[@]}."
            exit 1
          fi
          APK_PATH="${APK_FILES[0]}"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android SDK apksigner was not found at $APKSIGNER."
            exit 1
          fi
          SIGNING_INFO="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$SIGNING_INFO"
          ACTUAL_SHA256="$(printf '%s\n' "$SIGNING_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Release APK signer fingerprint does not match ANDROID_SIGNING_CERT_SHA256."
            exit 1
          fi
          cp "$APK_PATH" RSSReader-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: ${{ startsWith(github.ref, 'refs/tags/') && 'RSSReader-android.apk' || 'androidApp/build/outputs/apk/debug/*.apk' }}
          if-no-files-found: error

  build-jvm:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Windows desktop distribution
        run: .\gradlew.bat --no-daemon --console=plain :desktopApp:createDistributable

      - name: Package Windows desktop distribution
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path 'desktopApp/build/compose/binaries/main/app/*' -DestinationPath 'RSSReader-windows-x64.zip'

      - name: Upload Windows desktop distribution
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-app
          path: ${{ startsWith(github.ref, 'refs/tags/') && 'RSSReader-windows-x64.zip' || 'desktopApp/build/compose/binaries/main/app/**' }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-jvm]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-app
          path: release-assets/android

      - name: Download Windows desktop distribution
        uses: actions/download-artifact@v8
        with:
          name: windows-desktop-app
          path: release-assets/windows

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/android/RSSReader-android.apk
          release-assets/windows/RSSReader-windows-x64.zip
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag

  build-wasm:
    name: Build WebAssembly app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Wasm browser distribution
        run: ./gradlew --no-daemon --console=plain :webApp:wasmJsBrowserDistribution

      - name: Upload Wasm browser distribution
        uses: actions/upload-artifact@v7
        with:
          name: wasm-web-app
          path: webApp/build/dist/wasmJs/productionExecutable/**
          if-no-files-found: error

  deploy-pages:
    name: Deploy Wasm to GitHub Pages
    needs: build-wasm
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download Wasm browser distribution
        uses: actions/download-artifact@v8
        with:
          name: wasm-web-app
          path: wasm-dist

      - name: Checkout Pages repository
        uses: actions/checkout@v7
        with:
          repository: MarkusKlein-77/MarkusKlein-77.github.io
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: pages-site

      - name: Update RSSReader subdirectory
        run: |
          rm -rf pages-site/RSSReader
          mkdir -p pages-site/RSSReader
          cp -R wasm-dist/. pages-site/RSSReader/

      - name: Commit and push RSSReader deployment
        working-directory: pages-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RSSReader
          if git diff --cached --quiet; then
            echo "RSSReader is already up to date."
          else
            git commit -m "Deploy RSSReader Wasm app"
            git push
          fi
