name: Build platform artifacts

on:
  push:
    branches: [main, master]
    tags: ["v*", "V*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build Android debug APK
        run: ./gradlew --no-daemon --console=plain :androidApp:assembleDebug

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp androidApp/build/outputs/apk/debug/app-debug.apk RSSReader-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: ${{ startsWith(github.ref, 'refs/tags/') && 'RSSReader-android.apk' || 'androidApp/build/outputs/apk/debug/*.apk' }}
          if-no-files-found: error

  build-jvm:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Windows desktop distribution
        run: .\gradlew.bat --no-daemon --console=plain :desktopApp:createDistributable

      - name: Package Windows desktop distribution
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path 'desktopApp/build/compose/binaries/main/app/*' -DestinationPath 'RSSReader-windows-x64.zip'

      - name: Upload Windows desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-app
          path: ${{ startsWith(github.ref, 'refs/tags/') && 'RSSReader-windows-x64.zip' || 'desktopApp/build/compose/binaries/main/app/**' }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-jvm]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: android-app
          path: release-assets/android

      - name: Download Windows desktop distribution
        uses: actions/download-artifact@v5
        with:
          name: windows-desktop-app
          path: release-assets/windows

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/android/RSSReader-android.apk
          release-assets/windows/RSSReader-windows-x64.zip
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag

  build-wasm:
    name: Build WebAssembly app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Wasm browser distribution
        run: ./gradlew --no-daemon --console=plain :webApp:wasmJsBrowserDistribution

      - name: Upload Wasm browser distribution
        uses: actions/upload-artifact@v4
        with:
          name: wasm-web-app
          path: webApp/build/dist/wasmJs/productionExecutable/**
          if-no-files-found: error

  deploy-pages:
    name: Deploy Wasm to GitHub Pages
    needs: build-wasm
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download Wasm browser distribution
        uses: actions/download-artifact@v5
        with:
          name: wasm-web-app
          path: wasm-dist

      - name: Checkout Pages repository
        uses: actions/checkout@v7
        with:
          repository: MarkusKlein-77/MarkusKlein-77.github.io
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: pages-site

      - name: Update RSSReader subdirectory
        run: |
          rm -rf pages-site/RSSReader
          mkdir -p pages-site/RSSReader
          cp -R wasm-dist/. pages-site/RSSReader/

      - name: Commit and push RSSReader deployment
        working-directory: pages-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RSSReader
          if git diff --cached --quiet; then
            echo "RSSReader is already up to date."
          else
            git commit -m "Deploy RSSReader Wasm app"
            git push
          fi
