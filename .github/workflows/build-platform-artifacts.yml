name: Build platform artifacts

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build Android debug APK
        run: ./gradlew --no-daemon --console=plain :androidApp:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-jvm:
    name: Build JVM desktop app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build JVM desktop distribution
        run: ./gradlew --no-daemon --console=plain :desktopApp:createDistributable

      - name: Upload JVM desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: jvm-desktop-app
          path: desktopApp/build/compose/binaries/main/app/**
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Wasm browser distribution
        run: ./gradlew --no-daemon --console=plain :webApp:wasmJsBrowserDistribution

      - name: Upload Wasm browser distribution
        uses: actions/upload-artifact@v4
        with:
          name: wasm-web-app
          path: webApp/build/dist/wasmJs/productionExecutable/**
          if-no-files-found: error
