name: Build platform artifacts

on:
  push:
    branches: [main, master]
    tags: ["v*", "V*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shared:
    name: Test shared module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run shared tests
        run: ./gradlew --no-daemon --console=plain :shared:desktopTest

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configure Android release signing
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/android-release-key.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            if [ ! -s "$KEYSTORE_PATH" ]; then
              echo "::error::Decoded Android keystore is empty."
              exit 1
            fi
            {
              echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Android signing secrets are required for update-capable builds."
            exit 1
          fi

      - name: Build Android debug APK
        if: ${{ github.event_name == 'pull_request' || (!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
        run: ./gradlew --no-daemon --console=plain :androidApp:assembleDebug

      - name: Build signed Android APK
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: ./gradlew --no-daemon --console=plain :androidApp:assembleRelease

      - name: Prepare and verify update APK
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_SIGNING_CERT_SHA256" ]; then
            echo "::error::Set the ANDROID_SIGNING_CERT_SHA256 Actions variable to the release certificate fingerprint."
            exit 1
          fi
          mapfile -t APK_FILES < <(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#APK_FILES[@]}."
            exit 1
          fi
          APK_PATH="${APK_FILES[0]}"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android SDK apksigner was not found at $APKSIGNER."
            exit 1
          fi
          SIGNING_INFO="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$SIGNING_INFO"
          ACTUAL_SHA256="$(printf '%s\n' "$SIGNING_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK signer fingerprint does not match ANDROID_SIGNING_CERT_SHA256."
            exit 1
          fi
          cp "$APK_PATH" RSSReader-android.apk

      - name: Upload signed Android APK
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: RSSReader-android.apk
          if-no-files-found: error

      - name: Upload Android debug APK
        if: ${{ github.event_name == 'pull_request' || (!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
        uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-jvm:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Windows desktop distribution
        run: .\gradlew.bat --no-daemon --console=plain :desktopApp:createDistributable

      - name: Package Windows desktop distribution
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path 'desktopApp/build/compose/binaries/main/app/*' -DestinationPath 'RSSReader-windows-x64.zip'

      - name: Upload Windows desktop distribution
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-app
          path: ${{ startsWith(github.ref, 'refs/tags/') && 'RSSReader-windows-x64.zip' || 'desktopApp/build/compose/binaries/main/app/**' }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-jvm, test-shared]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-app
          path: release-assets/android

      - name: Download Windows desktop distribution
        uses: actions/download-artifact@v8
        with:
          name: windows-desktop-app
          path: release-assets/windows

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/android/RSSReader-android.apk
          release-assets/windows/RSSReader-windows-x64.zip
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag

  build-wasm:
    name: Build WebAssembly app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Wasm browser distribution
        run: ./gradlew --no-daemon --console=plain :webApp:wasmJsBrowserDistribution

      - name: Upload Wasm browser distribution
        uses: actions/upload-artifact@v7
        with:
          name: wasm-web-app
          path: webApp/build/dist/wasmJs/productionExecutable/**
          if-no-files-found: error

  deploy-pages:
    name: Publish Android build and deploy Wasm to GitHub Pages
    needs: [build-android, build-wasm, test-shared]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: rssreader-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout RSS Reader source
        uses: actions/checkout@v7
        with:
          path: rss-reader-source

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-app
          path: android-artifact

      - name: Download Wasm browser distribution
        uses: actions/download-artifact@v8
        with:
          name: wasm-web-app
          path: wasm-dist

      - name: Checkout Pages repository
        uses: actions/checkout@v7
        with:
          repository: MarkusKlein-77/MarkusKlein-77.github.io
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: pages-site

      - name: Publish normal Android build and deploy Wasm
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
            BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
            MANIFEST="pages-site/RSSReader/updates/latest-build.json"
            if [ -f "$MANIFEST" ]; then
              PUBLISHED_BUILD=$(jq -r '.buildNumber // 0' "$MANIFEST")
              if [ "$PUBLISHED_BUILD" -ge "$BUILD_NUMBER" ]; then
                echo "A newer Android build is already published; skipping this stale Pages deployment."
                exit 0
              fi
            fi

            APK_PATH="android-artifact/RSSReader-android.apk"
            if [ ! -s "$APK_PATH" ]; then
              echo "::error::The signed Android APK is missing."
              exit 1
            fi
            APK_SIZE=$(stat -c '%s' "$APK_PATH")
            if [ "$APK_SIZE" -ge 104857600 ]; then
              echo "::error::The Android APK exceeds GitHub Pages' 100 MiB per-file limit."
              exit 1
            fi

            printf -v PADDED_BUILD_NUMBER '%012d' "$BUILD_NUMBER"
            SHORT_SHA="${GITHUB_SHA:0:12}"
            BUILD_DIRECTORY="pages-site/RSSReader/updates/builds/${PADDED_BUILD_NUMBER}-${SHORT_SHA}"
            mkdir -p "$BUILD_DIRECTORY"
            cp "$APK_PATH" "$BUILD_DIRECTORY/RSSReader-android.apk"
            mkdir -p pages-site/RSSReader/updates/latest
            cp "$APK_PATH" pages-site/RSSReader/updates/latest/RSSReader-android.apk
            APK_SHA256=$(sha256sum "$BUILD_DIRECTORY/RSSReader-android.apk" | cut -d ' ' -f 1)
            SUMMARY=$(git -C rss-reader-source log -1 --format=%s "$GITHUB_SHA" | cut -c1-240)
            APK_URL="https://onkelholle.de/RSSReader/updates/builds/${PADDED_BUILD_NUMBER}-${SHORT_SHA}/RSSReader-android.apk"

            mkdir -p "$(dirname "$MANIFEST")"
            jq -n \
              --argjson buildNumber "$BUILD_NUMBER" \
              --argjson runId "$GITHUB_RUN_ID" \
              --arg commitSha "$GITHUB_SHA" \
              --arg builtAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --arg summary "$SUMMARY" \
              --arg apkUrl "$APK_URL" \
              --arg apkSha256 "$APK_SHA256" \
              '{
                schemaVersion: 1,
                buildNumber: $buildNumber,
                runId: $runId,
                commitSha: $commitSha,
                builtAt: $builtAt,
                summary: $summary,
                assets: {
                  android: {
                    url: $apkUrl,
                    sha256: $apkSha256
                  }
                }
              }' > "$MANIFEST"

            find pages-site/RSSReader/updates/builds -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
              sort -r |
              tail -n +11 |
              while IFS= read -r OLD_BUILD; do
                rm -rf -- "pages-site/RSSReader/updates/builds/$OLD_BUILD"
              done
          fi

          mkdir -p pages-site/RSSReader
          find pages-site/RSSReader -mindepth 1 -maxdepth 1 ! -name updates -exec rm -rf -- {} +
          mkdir -p pages-site/RSSReader
          cp -R wasm-dist/. pages-site/RSSReader/

      - name: Commit and push build publication
        working-directory: pages-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RSSReader
          if git diff --cached --quiet; then
            echo "RSSReader is already up to date."
          else
            git commit -m "Deploy RSSReader and publish Android build"
            git push
          fi
